CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SLEEP=y

# 4 hours. Default 900000 (15 min) is too short: a coffee break cost a full
# wake cycle. Note awake time is the usage window PLUS this trailing timeout,
# so a normal day leaves the central awake 10-12h.
# The central is the expensive half. At 1500mAh and 10h awake/day that is ~11
# months, against 2.8 years fully asleep. PREF_INT below is the other lever.
# Ceiling is int32 ms (~24.8 days); activity.c compares an int32_t inactive_time.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000

# A BLE master must transmit at EVERY connection event and gets no benefit from
# peripheral latency. Default 6 = 7.5ms = 133 tx/second = 440-700uA on this half.
# 12 = 15ms halves that, costing up to +7.5ms on right-hand keys.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
