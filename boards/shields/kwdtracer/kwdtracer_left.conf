CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SLEEP=y

# 2 hours. Default 900000 (15 min) is too short: a coffee break cost a full
# wake cycle. 4h was the earlier choice, made when waking cost ~8s; it now costs
# ~1.5s, so a shorter timeout is cheap. Note awake time is the usage window PLUS
# this trailing timeout. At 1500mAh: ~10 months at 4h, ~12 at 2h, ~13.5 at 15min,
# so the curve flattens fast. PREF_INT below is the other lever.
# Ceiling is int32 ms (~24.8 days); activity.c compares an int32_t inactive_time.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# A BLE master must transmit at EVERY connection event and gets no benefit from
# peripheral latency. Default 6 = 7.5ms = 133 tx/second = 440-700uA on this half.
# 12 = 15ms halves that, costing up to +7.5ms on right-hand keys.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
