CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_SLEEP=y

# 1 hour. Covers lunch and a meeting without staying awake all evening.
# Default 900000 (15 min) is too short: a coffee break cost a full wake cycle.
# Kept deliberately modest because the wake path is now ~1.0-1.6s, not ~8s, so
# there is little left to hide. The central is the expensive half: at 1500mAh it
# runs ~19 months at 4h awake/day but only ~8 months if kept awake 17h/day.
# Ceiling is int32 ms (~24.8 days); activity.c compares an int32_t inactive_time.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# A BLE master must transmit at EVERY connection event and gets no benefit from
# peripheral latency. Default 6 = 7.5ms = 133 tx/second = 440-700uA on this half.
# 12 = 15ms halves that, costing up to +7.5ms on right-hand keys.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
