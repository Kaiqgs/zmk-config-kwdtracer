CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# The peripheral must never deep sleep. It has no radio while in System OFF, so
# the central cannot summon it, and central.c's start_scanning() then runs a
# 60ms/30ms passive scan (50% radio duty) with NO backoff or timeout, hunting a
# half that physically cannot answer: ~2.3-2.8mA, killing 110mAh in ~40 hours,
# while also stealing radio time from the central's own advertising.
# Keeping the peripheral up costs 45-65uA connected, 85-120uA orphaned overnight
# (directed adv drops to low-duty 100-150ms after 1.28s). Months either way.
# A long-but-finite timeout is NOT equivalent: it brings the runaway scan back
# every time the peripheral does eventually sleep.
CONFIG_ZMK_SLEEP=n
